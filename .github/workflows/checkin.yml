name: AI 五平台每日签到

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC+8
    #   0:13 UTC  = 08:13 北京
    #   2:13 UTC  = 10:13 北京  ← 排在 Qoder 活动窗口(10:00)开启之后
    #   12:13 UTC = 20:13 北京
    - cron: '13 0,2,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ---- 平台凭据 ----
      TRAE_REFRESH_TOKEN: ${{ secrets.TRAE_REFRESH_TOKEN }}
      TRAE_ACCOUNTS:       ${{ secrets.TRAE_ACCOUNTS }}
      # 必填！签到按「设备号」维度判定，没有客户端真实注册过的设备号会被拒成
      # 9074 或误报 9095（该设备当天已被别的账号用过），App 里会显示仍未签到。
      TRAE_DEVICE_ID:      ${{ secrets.TRAE_DEVICE_ID }}
      WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
      QODER_TOKENS:            ${{ secrets.QODER_TOKENS }}
      QODER_GLOBAL_TOKENS:     ${{ secrets.QODER_GLOBAL_TOKENS }}
      ZCODE_CN_TOKENS:         ${{ secrets.ZCODE_CN_TOKENS }}
      ZCODE_INTL_TOKENS:       ${{ secrets.ZCODE_INTL_TOKENS }}
      MINIMAX_TOKEN:           ${{ secrets.MINIMAX_TOKEN }}
      MINIMAX_USER_ID:         ${{ secrets.MINIMAX_USER_ID }}
      MINIMAX_UUID:            ${{ secrets.MINIMAX_UUID }}
      MINIMAX_DEVICE_ID:       ${{ secrets.MINIMAX_DEVICE_ID }}

      # ---- 账号显示名（可选，逗号分隔多账号；不填则显示真实 ID 短形式）----
      TRAE_LABEL:      ${{ secrets.TRAE_LABEL }}
      WORKBUDDY_LABEL: ${{ secrets.WORKBUDDY_LABEL }}
      QODER_CN_LABEL:  ${{ secrets.QODER_CN_LABEL }}
      QODER_INTL_LABEL: ${{ secrets.QODER_INTL_LABEL }}
      ZCODE_CN_LABEL:     ${{ secrets.ZCODE_CN_LABEL }}
      ZCODE_INTL_LABEL:   ${{ secrets.ZCODE_INTL_LABEL }}
      MINIMAX_LABEL:      ${{ secrets.MINIMAX_LABEL }}

      # ---- 推送（企业微信 / PushPlus，可只填一个）----
      # 注意：Trae 脚本读 PLUSPLUS_TOKEN（Plus+Plus），
      # 其他脚本读 PUSHPLUS_TOKEN（Push+Plus），这里统一互通。
      # 配 PUSHPLUS_TOKEN 一条即可，两个脚本都能收到。
      WECOM_WEBHOOK:  ${{ secrets.WECOM_WEBHOOK }}
      QYWX_TOKEN:     ${{ secrets.QYWX_TOKEN || secrets.WECOM_WEBHOOK }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.PLUSPLUS_TOKEN }}
      PLUSPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.PLUSPLUS_TOKEN }}

    steps:
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests python-dotenv

      # token 续期后会轮换，必须跨次保留，否则第二次运行必然 401。
      # 注意：三个脚本都把缓存写在「脚本所在目录」即 scripts/ 下，文件名各不相同，
      # 路径写错就等于没缓存 —— refreshToken 每轮被轮换作废，就会「越刷越失效」。
      - name: 恢复 token 缓存
        uses: actions/cache@v4
        with:
          path: |
            scripts/.trae_token_cache.json
            scripts/.minimax_token.json
            scripts/wb_refresh_tokens.json
            scripts/WORKBUDDY_ACCESS_TOKEN.txt
          key: ai-checkin-token-${{ github.run_id }}
          restore-keys: ai-checkin-token-

      - name: 拉取签到脚本
        run: |
          mkdir -p scripts
          base=https://raw.githubusercontent.com
          set -e
          curl -fsSL "$base/L0NE-6/Trae-AutoCheckin/main/trae_checkin.py"        -o scripts/trae_checkin.py
          curl -fsSL "$base/L0NE-6/WorkBuddy-Daily/main/workbuddy_daily.py"     -o scripts/workbuddy_daily.py
          curl -fsSL "$base/L0NE-6/Qoder-Daily/main/qoder_daily.py"             -o scripts/qoder_daily.py
          curl -fsSL "$base/L0NE-6/ZCode-Daily/main/zcode_cn_daily.py"          -o scripts/zcode_cn_daily.py
          curl -fsSL "$base/L0NE-6/ZCode-Daily/main/zcode_intl_daily.py"        -o scripts/zcode_intl_daily.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/minimax_checkin.py"          -o scripts/minimax_checkin.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/sendNotify.py"              -o scripts/sendNotify.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/vless_proxy.py"             -o scripts/vless_proxy.py
          chmod +x scripts/*.py
          ls -l scripts/

      - name: 执行签到（关闭各脚本自带推送）
        run: |
          set -uo pipefail
          cd scripts
          mkdir -p ../logs

          # 关掉各脚本自带的推送通道，最后由汇总步骤统一发一条
          unset PUSHPLUS_TOKEN PLUSPLUS_TOKEN WECOM_WEBHOOK QYWX_TOKEN \
                DINGTALK_WEBHOOK DINGTALK_SECRET BARK_URL 2>/dev/null || true

          # ---- token 规范化 ----
          # GitHub Secret 粘贴很容易带上引号、尾随换行或空格：
          # Trae 会报 10101（token 与客户端不匹配），MiniMax 直接 401。
          # 这里统一去掉 CR、首尾空白和成对引号，避免每次都要人肉排查。
          norm () {
            printf '%s' "$1" | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          for v in TRAE_REFRESH_TOKEN WORKBUDDY_REFRESH_TOKEN \
                   QODER_TOKENS QODER_GLOBAL_TOKENS \
                   ZCODE_CN_TOKENS ZCODE_INTL_TOKENS \
                   MINIMAX_TOKEN MINIMAX_USER_ID; do
            if [ -n "${!v-}" ]; then export "$v=$(norm "${!v}")"; fi
          done
          echo "规范化完成（token 长度：Trae ${#TRAE_REFRESH_TOKEN} / MiniMax ${#MINIMAX_TOKEN}）"

          : > ../logs/status.tsv

          # 不少脚本签到失败时依然 exit 0（例如 token 被轮换作废），
          # 只看退出码会把失败报成成功，所以必须同时扫日志。
          FAIL_RE='token失效|鉴权失败|not matched|[^0-9]10101[^0-9]|STATUS_ERR|Traceback \(most recent|read timed out|ConnectionError|Errno '

          run_one () {
            local name="$1" file="$2" need="$3" key="$4"
            echo ""
            echo "════════ $name ════════"
            if [ -z "$need" ] || [ -z "${!need}" ]; then
              echo "⏭️  未配置 $need，跳过"
              printf '%s\t%s\tSKIP\t%s\n' "$name" "$key" "未配置 $need" >> ../logs/status.tsv
              return 0
            fi
            set +e
            python3 "$file" > "../logs/$key.log" 2>&1
            local rc=$?
            set -e
            tail -20 "../logs/$key.log" || true
            local st="OK"
            if [ "$rc" -ne 0 ] || grep -qEi "$FAIL_RE" "../logs/$key.log"; then
              st="FAIL"
              # 缓存里的 token 坏了就丢掉它，下一轮回落到 Secret 重新起链
              case "$key" in
                trae)      rm -f .trae_token_cache.json   ;;
                minimax)   rm -f .minimax_token.json      ;;
                workbuddy) rm -f wb_refresh_tokens.json   ;;
              esac
              echo "⚠️  $name 判定为失败（退出码 $rc + 日志扫描）"
            fi
            # Trae 的 9095 = 「当前设备今日已被签过」，可能指的是别的账号，
            # 脚本会当成已签到上报。若账号状态仍是未签到，按失败处理，别报假成功。
            if [ "$st" = "OK" ] && [ "$key" = "trae" ] \
               && grep -q '今日已签: False' "../logs/$key.log" \
               && grep -q '9095' "../logs/$key.log"; then
              st="FAIL"
              echo "⚠️  Trae 返回 9095 但账号仍未签到 —— 设备号被别的账号占用，请检查 TRAE_DEVICE_ID"
            fi
            printf '%s\t%s\t%s\t\n' "$name" "$key" "$st" >> ../logs/status.tsv
          }

          run_one "Trae"       trae_checkin.py      TRAE_REFRESH_TOKEN      trae
          run_one "WorkBuddy"  workbuddy_daily.py   WORKBUDDY_REFRESH_TOKEN workbuddy
          run_one "Qoder"      qoder_daily.py       QODER_TOKENS            qoder_cn
          run_one "Qoder Intl" qoder_daily.py       QODER_GLOBAL_TOKENS     qoder_intl
          run_one "ZCode"      zcode_cn_daily.py    ZCODE_CN_TOKENS         zcode_cn
          run_one "ZCode Intl" zcode_intl_daily.py  ZCODE_INTL_TOKENS       zcode_intl
          run_one "MiniMax"    minimax_checkin.py   MINIMAX_TOKEN           minimax
          exit 0

      - name: 汇总并推送一条消息
        run: |
          python3 - <<'PYEOF'
          import os, re, json, base64, datetime, urllib.request, urllib.parse

          rows = []
          if os.path.exists("logs/status.tsv"):
              for line in open("logs/status.tsv", encoding="utf-8"):
                  if not line.strip():
                      continue
                  p = line.rstrip("\n").split("\t")
                  rows.append((p[0], p[1], p[2], p[3] if len(p) > 3 else ""))

          ICON = {"OK": "✅", "FAIL": "❌", "SKIP": "⏭️"}
          NOISE = re.compile(r"[﻿‌‍]")
          # 与 bash 侧 FAIL_RE 保持一致：只有真正失败时才用，别把正常行误判成报错
          ERR_RE = re.compile(
              r"(token失效|鉴权失败|not matched|[^0-9]10101[^0-9]|AUTH_EXPIRED|STATUS_ERR|"
              r"Traceback \(most recent|[A-Za-z_.]*(?:Error|Exception)\b|Errno\s|"
              r"HTTP\s*[45]\d\d|状态码\s*[45]\d\d|\b(?:401|403|429)\b|"
              r"失败|错误|超时|invalid|expired|unauthorized|forbidden)", re.I)

          def clean(s):
              return NOISE.sub("", s).strip()

          # ---------- 真实账号标识（不要只显示「账号1」）----------
          def split_tokens(raw):
              return [p.strip() for p in re.split(r"[\n;]+", raw or "") if p.strip()]

          def short(s, n=22):
              return s if len(s) <= n else s[:n - 5] + "…" + s[-4:]

          def jwt_uid(tok):
              # ZCode 的 token 是 JWT，payload 里直接带 user_id
              try:
                  seg = tok.split(".")[1]
                  seg += "=" * (-len(seg) % 4)
                  p = json.loads(base64.urlsafe_b64decode(seg))
                  return str(p.get("user_id") or p.get("sub") or "")
              except Exception:
                  return ""

          _UID_CACHE = {}

          def qoder_uid(tok, base):
              # Qoder 的 /me/campaigns 会用 token 回传真实 uid
              hit = _UID_CACHE.get((tok, base))
              if hit is not None:
                  return hit
              try:
                  req = urllib.request.Request(
                      base + "/sash/api/v1/me/campaigns",
                      headers={"Authorization": "Bearer " + tok,
                               "User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      uid = str(json.loads(r.read().decode("utf-8", "replace")).get("uid") or "")
              except Exception:
                  uid = ""
              _UID_CACHE[(tok, base)] = uid
              return uid

          TOKEN_SRC = {
              "qoder_cn":   ("QODER_TOKENS",        "https://openapi.qoder.com.cn"),
              "qoder_intl": ("QODER_GLOBAL_TOKENS", "https://openapi.qoder.sh"),
              "zcode_cn":   ("ZCODE_CN_TOKENS",     ""),
              "zcode_intl": ("ZCODE_INTL_TOKENS",   ""),
          }

          def accounts(key, log):
              src = TOKEN_SRC.get(key)
              if src:
                  out = []
                  for t in split_tokens(os.environ.get(src[0], "")):
                      t = t.split("|")[0]
                      u = qoder_uid(t, src[1]) if src[1] else jwt_uid(t)
                      if u:
                          out.append(u)
                  if out:
                      return out
              if key == "minimax":
                  u = (os.environ.get("MINIMAX_USER_ID") or "").strip()
                  if u:
                      return [u]
              m = re.search(r"\[(\d{15,18})\]", log)     # Trae UID
              if m:
                  return [m.group(1)]
              m = re.search(r"(\d{2,3}\*{3,}\d{2})", log)     # WorkBuddy 脱敏手机号
              if m:
                  return [m.group(1)]
              return []

          # ---------- 账号显示名 ----------
          # 上游脚本只认序号（「账号1」），拿不到昵称；这里支持用 *_LABEL
          # secret 写人话（如「星野·主号」），没配就退回真实 ID 的短形式。
          LABEL_ENV = {
              "trae": "TRAE_LABEL", "workbuddy": "WORKBUDDY_LABEL",
              "qoder_cn": "QODER_CN_LABEL", "qoder_intl": "QODER_INTL_LABEL",
              "zcode_cn": "ZCODE_CN_LABEL", "zcode_intl": "ZCODE_INTL_LABEL",
              "minimax": "MINIMAX_LABEL",
          }

          def account_label(key, log):
              names = [n.strip() for n in
                       re.split(r"[,，]", os.environ.get(LABEL_ENV.get(key, ""), "")) if n.strip()]
              if names:
                  return "、".join(names)
              ids = accounts(key, log)
              return "、".join(short(a) for a in ids) if ids else "未命名账号"


          # Actions runner 用 UTC，直接 now() 会比北京时间少 8 小时
          now = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          def raw_log(key):
              path = "logs/%s.log" % key
              if not os.path.exists(path):
                  return ""
              return "\n".join(clean(l) for l in
                               open(path, encoding="utf-8", errors="replace"))

          # 排版：手机上表格会被折成竖条（WorkBuddy → Wo/rkB/udd/y），
          # 改成「平台名 · 账号名」一行、下面跟签到与积分，手机上才读得下去。
          BOX = "╔╗╚╝║┌┐└┘├┤┬┴┼│─┣┫━┃╭╮╰╯"
          JUNK = re.compile(r"未配置推送渠道|本次只记录日志|取消推送|未设置|已写回|凭据体检")

          def tidy(l):
              l = re.sub(r"^\[[\d:]{5,8}\](\[[^\]]{1,12}\])?\s*", "", l)
              l = re.sub(r"账号\d+\s*账号\d+\s*[:：]\s*", "", l)
              l = l.strip().strip(BOX).strip()
              l = re.sub(r"^[\U0001F300-\U0001FAFF☀-➿ℹ️\s]+", "", l)
              return l.strip()

          def usable(l):
              s = l.lstrip()
              return bool(s) and s[0] not in BOX and not JUNK.search(l)

          def compact(s):
              s = tidy(s)
              s = re.sub(r"^\[[^\]]{1,10}\]\s*", "", s)
              s = re.sub(r"^\d{6,}\s*[:：]\s*", "", s)
              s = re.sub(r"^(今日)?签到\s*[:：]\s*", "", s)
              s = re.sub(r"（\d{4}-\d{2}-\d{2}[^）]*）", "", s)
              m = re.match(r"^(.*?)（([^）]{1,12})）", s)      # 「今日已签到（第 4 天）」
              if m:
                  s = m.group(1).strip() + " " + m.group(2).strip()
              if len(s) > 30:
                  s = re.split(r"[，,（(]", s)[0].strip()
              return s[:32].strip(" ：:，,")

          def read_log(key):
              path = "logs/%s.log" % key
              if not os.path.exists(path):
                  return []
              return [clean(l) for l in open(path, encoding="utf-8", errors="replace")]

          def status_line(key, st):
              """签到情况：优先 RESULT= 行，其次按关键词挑一句"""
              lines = [l for l in read_log(key) if usable(l)]
              for l in reversed(lines):
                  m = re.search(r"RESULT=\S+\s*[|｜]\s*(.+)$", l)
                  if m:
                      return compact(m.group(1))
              PRIO = [("✅签到", 90), ("签到:", 88), ("签到连签", 86),
                      ("已签到", 80), ("今日已领取", 76), ("今日已签到", 76),
                      ("签到成功", 78), ("可领取", 60), ("套餐", 58)]
              best, score = None, -1
              for l in lines:
                  s = max([p for kw, p in PRIO if kw in l] or [0])
                  if s >= score:
                      best, score = l, s
              return compact(best) if best and score > 0 else ""

          def credit_line(key):
              """积分情况"""
              lines = read_log(key)
              for pat in (r"剩余积分合计\s*([\d.]+)", r"积分\s*[:：]\s*([\d.]+)"):
                  for l in lines:
                      m = re.search(pat, l)
                      if m:
                          return "积分 %s" % m.group(1)
              return ""

          def streak_line(key):
              lines = read_log(key)
              for l in lines:
                  m = re.search(r"签到连签\s*(\d+)\s*天", l)
                  if m:
                      return "连签 %s 天" % m.group(1)
              return ""

          def fail_line(key):
              """失败原因：排除方框横幅和通知类废话后，取真正的报错行"""
              lines = [l for l in read_log(key) if usable(l)]
              for l in reversed(lines):
                  if ERR_RE.search(l):
                      m = re.search(r"RESULT=\S+\s*[|｜]\s*(.+)$", l)
                      return tidy(m.group(1) if m else l)[:80]
              return "执行失败，详见日志"

          BADGE = {"OK": "✅ 成功", "FAIL": "❌ 失败", "SKIP": "⏭️ 跳过"}

          def build(rs, heading):
              md = ([heading, ""] if heading else [])
              for name, key, st, note in rows_of(rs):
                  ic = ICON.get(st, st)
                  label = account_label(key, raw_log(key))
                  # 标题行：状态图标 + 平台名 · 账号 …… 右侧状态徽章
                  md.append("%s **%s** · %s　　%s" % (
                      ic, clean(name), label, BADGE.get(st, st)))
                  if st == "FAIL":
                      # 引用块渲染成带底色的警示条，成功项保持普通文本
                      md.append("> " + fail_line(key))
                  else:
                      main = note or status_line(key, st) or "已签到"
                      extras = [b for b in (streak_line(key), credit_line(key)) if b]
                      md.append(main)
                      if extras:
                          md.append("· " + " · ".join(extras))
                  md.append("")
              md.append("📊 **成功 %d · 失败 %d**" % (
                  sum(1 for r in rs if r[2] == "OK"),
                  sum(1 for r in rs if r[2] == "FAIL")))
              return "\n".join(md).rstrip()

          def rows_of(rs):
              return [(n, k, s, (nt or "").replace("|", "/").strip()) for n, k, s, nt in rs]

          # ---------- HTML 卡片（PushPlus template=html 专用）----------
          # 只用内联 style，不用 class/id/外部 CSS，避免 PushPlus 清洗；
          # 用 display:table-cell 而不是 flex，兼容微信内置浏览器老版本。
          C_OK, C_BAD = "#22a45d", "#e05252"
          BG_OK, BG_BAD = "#eaf7ee", "#fdeeee"

          def esc(s):
              return (s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;"))

          def build_html(rs, heading):
              out = []
              out.append(
                  '<div style="background:#fff;padding:0 12px 20px;'
                  'font-family:-apple-system,BlinkMacSystemFont,\'PingFang SC\','
                  '\'Helvetica Neue\',Arial,sans-serif;font-size:15px;color:#222;'
                  'line-height:1.55;-webkit-text-size-adjust:100%;">'
              )
              if heading:
                  out.append(
                      '<div style="font-size:22px;font-weight:700;color:#111;'
                      'border-left:5px solid #2b6cff;padding-left:10px;'
                      'margin:4px 0 6px;">%s</div>' % esc(heading)
                  )
                  out.append(
                      '<div style="color:#8a8a8a;font-size:13px;margin:0 0 16px 15px;">'
                      '朝阳 %s</div>' % esc(heading.replace("AI 签到日报 · ", ""))
                  )
              for name, key, st, note in rows_of(rs):
                  ok = (st == "OK")
                  ic = ("&#10004;" if ok else "&#10007;")
                  color = C_OK if ok else C_BAD
                  bg    = BG_OK if ok else BG_BAD
                  label = account_label(key, raw_log(key))
                  badge = BADGE.get(st, st)
                  out.append(
                      '<div style="border:1px solid #ececec;border-radius:12px;'
                      'padding:12px 14px;margin:0 0 12px;background:#fff;">'
                  )
                  out.append(
                      '<div style="display:table;width:100%%;">'
                      '<div style="display:table-cell;vertical-align:middle;">'
                      '<span style="display:inline-block;width:26px;height:26px;'
                      'line-height:26px;border-radius:50%%;background:%s;color:#fff;'
                      'text-align:center;font-size:15px;font-weight:700;'
                      'margin-right:8px;vertical-align:middle;">%s</span>'
                      '<span style="font-size:18px;font-weight:700;color:#111;'
                      'vertical-align:middle;">%s</span>'
                      '<span style="color:#999;font-size:13px;vertical-align:middle;'
                      'margin-left:6px;">· %s</span>'
                      '</div>'
                      '<div style="display:table-cell;vertical-align:middle;'
                      'text-align:right;white-space:nowrap;">'
                      '<span style="display:inline-block;background:%s;color:%s;'
                      'border-radius:12px;padding:2px 10px;font-size:12px;'
                      'font-weight:600;">%s %s</span>'
                      '</div></div>' % (color, ic, esc(clean(name)), esc(label),
                                        bg, color, ic, esc(badge))
                  )
                  if not ok:
                      out.append(
                          '<div style="background:#fdf1f1;border-radius:8px;'
                          'padding:8px 12px;margin-top:10px;color:#c0392b;'
                          'font-size:13px;white-space:pre-wrap;">%s</div>'
                          % esc(fail_line(key))
                      )
                  else:
                      main = note or status_line(key, st) or "已签到"
                      extras = [b for b in (streak_line(key), credit_line(key)) if b]
                      out.append('<div style="margin-top:8px;color:#333;font-size:15px;">%s</div>'
                                 % esc(main))
                      if extras:
                          out.append('<div style="margin-top:2px;color:#666;font-size:13px;">· %s</div>'
                                     % esc(" · ".join(extras)))
                  out.append('</div>')
              n_ok  = sum(1 for r in rs if r[2] == "OK")
              n_bad = sum(1 for r in rs if r[2] == "FAIL")
              out.append(
                  '<div style="border:1px solid #ececec;border-radius:12px;'
                  'padding:14px 16px;margin-top:4px;background:#fff;">'
                  '<span style="color:#2b6cff;font-size:18px;margin-right:8px;">&#128202;</span>'
                  '<span style="font-size:18px;font-weight:700;color:#111;">'
                  '成功 <span style="color:%s;">%d</span> · 失败 <span style="color:%s;">%d</span>'
                  '</span></div>' % (C_OK, n_ok, C_BAD, n_bad)
              )
              out.append('</div>')
              return "".join(out)


          # 推送内容：不显示未配置的平台。
          # markdown 版不要标题（PushPlus 已用它做消息头）；HTML 版也不要把标题做进内容，
          # 否则 PushPlus 顶部渲染一次（title）+ 内容里又渲染一次 = 重复显示。
          content = build([r for r in rows if r[2] != "SKIP"], "")
          content_html = build_html([r for r in rows if r[2] != "SKIP"], "")
          # Actions 面板：保留完整信息，便于排查
          summary = build(rows, "## AI 签到日报 · " + now)

          open("summary.md", "w", encoding="utf-8").write(summary + "\n")
          step = os.environ.get("GITHUB_STEP_SUMMARY")
          if step:
              open(step, "a", encoding="utf-8").write(summary + "\n")
          print(content)

          def post(url, data, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR " + str(e)

          title = "AI 签到日报 · " + now
          sent = []
          pp = os.environ.get("PUSHPLUS_TOKEN", "")
          if pp:
              # PushPlus 走 HTML 卡片模板
              body = urllib.parse.urlencode({
                  "token": pp, "title": title,
                  "template": "html", "content": content_html}).encode()
              sent.append("PushPlus -> " + post("https://www.pushplus.plus/send", body)[:150])
          wc = os.environ.get("WECOM_WEBHOOK", "")
          qy = os.environ.get("QYWX_TOKEN", "")
          if wc or qy:
              url = wc or ("https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=" + qy)
              payload = json.dumps({
                  "msgtype": "markdown",
                  "markdown": {"content": content}}).encode()
              sent.append("企业微信 -> " + post(url, payload, {"Content-Type": "application/json"})[:150])

          if not sent:
              print("!! 未配置任何推送渠道，手机收不到通知")
          for s in sent:
              print(s)
          PYEOF

      # ---- 自愈闭环 ----
      # Trae / MiniMax / WorkBuddy 的 token 每次续期都会轮换，旧值立即作废。
      # 以前只能靠 actions/cache 跨次保留，但缓存会被驱逐（7 天不访问 / 超 10GB），
      # 一旦缓存丢失就回落到 Secret 里的旧种子 → 10101 / 401。
      # 这里把「本轮实际用掉并轮换出来的最新 token」写回 GitHub Secret，
      # 让 Secret 始终持有可用值，形成 Secret(种子) → cache(主存) → Secret(自愈) 三层保险。
      #
      # ⚠️ 需要一次性配置：创建一个有 secrets 写权限的 PAT，存为 Secret `SECRET_UPDATER_TOKEN`
      #    GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens
      #    Repository access: 仅选 Zuo-g/ai-checkin
      #    Repository permissions → Secrets: Read and write
      - name: 回写最新 token 到 GitHub Secrets（自愈）
        if: success() || failure()
        env:
          UPDATER_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          if [ -z "$UPDATER_TOKEN" ]; then
            echo "⚠️  未配置 SECRET_UPDATER_TOKEN，跳过 Secret 回写"
            echo "   （token 仍保存在 actions/cache；如需自愈请按上方注释创建 PAT）"
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, os, subprocess

          UPDATER = os.environ.get("UPDATER_TOKEN", "")

          def read_json(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def set_secret(name, value):
              """用 gh CLI 写回 Secret；失败只提示，不影响主流程"""
              if not value or not UPDATER:
                  return False
              print("::add-mask::" + value)          # 防止 token 进日志
              env = dict(os.environ, GH_TOKEN=UPDATER)
              r = subprocess.run(
                  ["gh", "secret", "set", name, "--body", value],
                  env=env, capture_output=True, text=True)
              if r.returncode == 0:
                  print("  ✓ %s 已回写（长度 %d）" % (name, len(value)))
                  return True
              print("  ✗ %s 回写失败: %s" % (name, (r.stderr or "").strip()[:120]))
              return False

          n = 0

          # ---- Trae：缓存形如 {账号键: {accessToken, refreshToken, ...}} ----
          trae = read_json("scripts/.trae_token_cache.json")
          if isinstance(trae, dict):
              tok = ""
              for rec in trae.values():
                  if isinstance(rec, dict) and rec.get("refreshToken"):
                      tok = rec["refreshToken"]
                      break
              if tok:
                  n += set_secret("TRAE_REFRESH_TOKEN", tok)
              else:
                  print("  - Trae: 缓存里没找到 refreshToken，跳过")

          # ---- MiniMax：缓存形如 {"token": "...", ...} ----
          mm = read_json("scripts/.minimax_token.json")
          if isinstance(mm, dict) and mm.get("token"):
              n += set_secret("MINIMAX_TOKEN", mm["token"])
          elif mm is not None:
              print("  - MiniMax: 缓存里没找到 token，跳过")

          # ---- WorkBuddy：Secret 形如 手机号:AT:RT（多账号换行分隔）----
          wb = read_json("scripts/wb_refresh_tokens.json")
          if isinstance(wb, dict):
              lines = []
              for phone, rec in wb.items():
                  if isinstance(rec, dict):
                      at, rt = rec.get("access_token", ""), rec.get("refresh_token", "")
                      if at and rt:
                          lines.append("%s:%s:%s" % (phone, at, rt))
              if lines:
                  n += set_secret("WORKBUDDY_REFRESH_TOKEN", "\n".join(lines))
              else:
                  print("  - WorkBuddy: 缓存里没找到 AT:RT，跳过")

          print("── Secret 回写完成：%d 个已更新 ──" % n)
          PYEOF

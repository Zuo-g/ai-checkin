name: AI 五平台每日签到

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC+8
    #   0:13 UTC  = 08:13 北京
    #   2:13 UTC  = 10:13 北京  ← 排在 Qoder 活动窗口(10:00)开启之后
    #   12:13 UTC = 20:13 北京
    - cron: '13 0,2,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ---- 平台凭据 ----
      TRAE_REFRESH_TOKEN: ${{ secrets.TRAE_REFRESH_TOKEN }}
      TRAE_ACCOUNTS:       ${{ secrets.TRAE_ACCOUNTS }}
      WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
      QODER_TOKENS:            ${{ secrets.QODER_TOKENS }}
      QODER_GLOBAL_TOKENS:     ${{ secrets.QODER_GLOBAL_TOKENS }}
      ZCODE_CN_TOKENS:         ${{ secrets.ZCODE_CN_TOKENS }}
      ZCODE_INTL_TOKENS:       ${{ secrets.ZCODE_INTL_TOKENS }}
      MINIMAX_TOKEN:           ${{ secrets.MINIMAX_TOKEN }}
      MINIMAX_USER_ID:         ${{ secrets.MINIMAX_USER_ID }}
      MINIMAX_UUID:            ${{ secrets.MINIMAX_UUID }}
      MINIMAX_DEVICE_ID:       ${{ secrets.MINIMAX_DEVICE_ID }}

      # ---- 推送（企业微信 / PushPlus，可只填一个）----
      # 注意：Trae 脚本读 PLUSPLUS_TOKEN（Plus+Plus），
      # 其他脚本读 PUSHPLUS_TOKEN（Push+Plus），这里统一互通。
      # 配 PUSHPLUS_TOKEN 一条即可，两个脚本都能收到。
      WECOM_WEBHOOK:  ${{ secrets.WECOM_WEBHOOK }}
      QYWX_TOKEN:     ${{ secrets.QYWX_TOKEN || secrets.WECOM_WEBHOOK }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.PLUSPLUS_TOKEN }}
      PLUSPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.PLUSPLUS_TOKEN }}

    steps:
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests python-dotenv

      # token 续期后会轮换，必须跨次保留，否则第二次运行必然 401
      - name: 恢复 token 缓存
        uses: actions/cache@v4
        with:
          path: |
            .trae_token.json
            .minimax_token.json
            .wb_intl_tokens.json
          key: ai-checkin-token-${{ github.run_id }}
          restore-keys: ai-checkin-token-

      - name: 拉取签到脚本
        run: |
          mkdir -p scripts
          base=https://raw.githubusercontent.com
          set -e
          curl -fsSL "$base/L0NE-6/Trae-AutoCheckin/main/trae_checkin.py"        -o scripts/trae_checkin.py
          curl -fsSL "$base/L0NE-6/WorkBuddy-Daily/main/workbuddy_daily.py"     -o scripts/workbuddy_daily.py
          curl -fsSL "$base/L0NE-6/Qoder-Daily/main/qoder_daily.py"             -o scripts/qoder_daily.py
          curl -fsSL "$base/L0NE-6/ZCode-Daily/main/zcode_cn_daily.py"          -o scripts/zcode_cn_daily.py
          curl -fsSL "$base/L0NE-6/ZCode-Daily/main/zcode_intl_daily.py"        -o scripts/zcode_intl_daily.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/minimax_checkin.py"          -o scripts/minimax_checkin.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/sendNotify.py"              -o scripts/sendNotify.py
          curl -fsSL "$base/mgmg22/QinglongMy/main/vless_proxy.py"             -o scripts/vless_proxy.py
          chmod +x scripts/*.py
          ls -l scripts/

      - name: 执行签到（关闭各脚本自带推送）
        run: |
          set -uo pipefail
          cd scripts
          mkdir -p ../logs

          # 关掉各脚本自带的推送通道，最后由汇总步骤统一发一条
          unset PUSHPLUS_TOKEN PLUSPLUS_TOKEN WECOM_WEBHOOK QYWX_TOKEN \
                DINGTALK_WEBHOOK DINGTALK_SECRET BARK_URL 2>/dev/null || true

          : > ../logs/status.tsv

          run_one () {
            local name="$1" file="$2" need="$3" key="$4"
            echo ""
            echo "════════ $name ════════"
            if [ -z "$need" ] || [ -z "${!need}" ]; then
              echo "⏭️  未配置 $need，跳过"
              printf '%s\t%s\tSKIP\t%s\n' "$name" "$key" "未配置 $need" >> ../logs/status.tsv
              return 0
            fi
            set +e
            python3 "$file" > "../logs/$key.log" 2>&1
            local rc=$?
            set -e
            tail -20 "../logs/$key.log" || true
            local st="OK"
            [ "$rc" -ne 0 ] && st="FAIL"
            printf '%s\t%s\t%s\t\n' "$name" "$key" "$st" >> ../logs/status.tsv
          }

          run_one "Trae"       trae_checkin.py      TRAE_REFRESH_TOKEN      trae
          run_one "WorkBuddy"  workbuddy_daily.py   WORKBUDDY_REFRESH_TOKEN workbuddy
          run_one "Qoder"      qoder_daily.py       QODER_TOKENS            qoder_cn
          run_one "Qoder Intl" qoder_daily.py       QODER_GLOBAL_TOKENS     qoder_intl
          run_one "ZCode"      zcode_cn_daily.py    ZCODE_CN_TOKENS         zcode_cn
          run_one "ZCode Intl" zcode_intl_daily.py  ZCODE_INTL_TOKENS       zcode_intl
          run_one "MiniMax"    minimax_checkin.py   MINIMAX_TOKEN           minimax
          exit 0

      - name: 汇总并推送一条消息
        run: |
          python3 - <<'PYEOF'
          import os, re, json, base64, datetime, urllib.request, urllib.parse

          rows = []
          if os.path.exists("logs/status.tsv"):
              for line in open("logs/status.tsv", encoding="utf-8"):
                  if not line.strip():
                      continue
                  p = line.rstrip("\n").split("\t")
                  rows.append((p[0], p[1], p[2], p[3] if len(p) > 3 else ""))

          ICON = {"OK": "✅", "FAIL": "❌", "SKIP": "⏭️"}
          NOISE = re.compile(r"[﻿‌‍]")
          ERR_RE = re.compile(
              r"(Traceback \(most recent|[A-Za-z_.]*(?:Error|Exception)\b|Errno\s|"
              r"HTTP\s*[45]\d\d|状态码\s*[45]\d\d|\b(?:401|403|429)\b|"
              r"失败|错误|超时|invalid|expired|unauthorized|forbidden)", re.I)

          def clean(s):
              return NOISE.sub("", s).strip()

          # ---------- 真实账号标识（不要只显示「账号1」）----------
          def split_tokens(raw):
              return [p.strip() for p in re.split(r"[\n;]+", raw or "") if p.strip()]

          def short(s, n=22):
              return s if len(s) <= n else s[:n - 5] + "…" + s[-4:]

          def jwt_uid(tok):
              # ZCode 的 token 是 JWT，payload 里直接带 user_id
              try:
                  seg = tok.split(".")[1]
                  seg += "=" * (-len(seg) % 4)
                  p = json.loads(base64.urlsafe_b64decode(seg))
                  return str(p.get("user_id") or p.get("sub") or "")
              except Exception:
                  return ""

          _UID_CACHE = {}

          def qoder_uid(tok, base):
              # Qoder 的 /me/campaigns 会用 token 回传真实 uid
              hit = _UID_CACHE.get((tok, base))
              if hit is not None:
                  return hit
              try:
                  req = urllib.request.Request(
                      base + "/sash/api/v1/me/campaigns",
                      headers={"Authorization": "Bearer " + tok,
                               "User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      uid = str(json.loads(r.read().decode("utf-8", "replace")).get("uid") or "")
              except Exception:
                  uid = ""
              _UID_CACHE[(tok, base)] = uid
              return uid

          TOKEN_SRC = {
              "qoder_cn":   ("QODER_TOKENS",        "https://openapi.qoder.com.cn"),
              "qoder_intl": ("QODER_GLOBAL_TOKENS", "https://openapi.qoder.sh"),
              "zcode_cn":   ("ZCODE_CN_TOKENS",     ""),
              "zcode_intl": ("ZCODE_INTL_TOKENS",   ""),
          }

          def accounts(key, log):
              src = TOKEN_SRC.get(key)
              if src:
                  out = []
                  for t in split_tokens(os.environ.get(src[0], "")):
                      t = t.split("|")[0]
                      u = qoder_uid(t, src[1]) if src[1] else jwt_uid(t)
                      if u:
                          out.append(u)
                  if out:
                      return out
              if key == "minimax":
                  u = (os.environ.get("MINIMAX_USER_ID") or "").strip()
                  if u:
                      return [u]
              m = re.search(r"\[(\d{15,18})\]", log)     # Trae UID
              if m:
                  return [m.group(1)]
              m = re.search(r"(\d{2,3}\*{3,}\d{2})", log)     # WorkBuddy 脱敏手机号
              if m:
                  return [m.group(1)]
              return []

          # 说明行的优先级：分数高的优先，同分取更靠后出现的
          PRIO = [("RESULT=", 100), ("🏁", 92), ("✅签到", 88), ("签到:", 86),
                  ("签到连签", 82), ("签到成功", 80), ("已签到", 76),
                  ("今日已领取", 74), ("今日已签到", 74), ("剩余积分", 60),
                  ("积分", 50), ("Credits", 58), ("套餐", 40), ("领取", 38)]

          def tidy(l):
              l = re.sub(r"^\[[\d:]{5,8}\](\[[^\]]{1,12}\])?\s*", "", l)
              l = re.sub(r"账号\d+\s*账号\d+\s*[:：]\s*", "", l)
              l = re.sub(r"^[\U0001F300-\U0001FAFF☀-➿ℹ️\s]+", "", l)
              return l.strip()

          # 方框横幅行（╔ ║ ╚）只是标题，不作为说明
          def is_banner(l):
              s = l.lstrip()
              return bool(s) and s[0] in "╔╗╚╝║"

          def detail(key, st):
              path = "logs/%s.log" % key
              if not os.path.exists(path):
                  return "执行失败，详见日志" if st == "FAIL" else ""
              lines = [clean(l) for l in open(path, encoding="utf-8", errors="replace")]
              lines = [l for l in lines if l]
              # 失败时优先给出真正的报错行，避免只显示「签到报告」这种标题
              if st == "FAIL":
                  for l in reversed(lines):
                      if ERR_RE.search(l):
                          return tidy(l)[:110]
              for l in reversed(lines):
                  m = re.search(r"RESULT=\S+\s*[|｜]\s*(.+)$", l)
                  if m:
                      return tidy(m.group(1))[:110]
              best, score = None, -1
              for i, l in enumerate(lines):
                  if is_banner(l):
                      continue
                  s = max([p for kw, p in PRIO if kw in l] or [0])
                  if s >= score:
                      best, score = l, s
              if best and score > 0:
                  return tidy(best)[:110]
              for l in reversed(lines):
                  if not l.startswith(("Traceback", "File ", " ", "\t")):
                      return tidy(l)[:110]
              return "执行失败，详见日志" if st == "FAIL" else ""

          now = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")

          def raw_log(key):
              path = "logs/%s.log" % key
              if not os.path.exists(path):
                  return ""
              return "\n".join(clean(l) for l in
                               open(path, encoding="utf-8", errors="replace"))

          def build(rs, heading):
              md = ([heading + " · " + now, ""] if heading else [])
              md += ["| 平台 | 账号 | 状态 | 说明 |", "|---|---|---|---|"]
              for name, key, st, note in rs:
                  d = (note or detail(key, st)).replace("|", "/").replace("\n", " ")
                  d = re.sub(r"\s{2,}", " ", d).strip()[:70]
                  who = "、".join(short(a) for a in accounts(key, raw_log(key)))
                  md.append("| %s | %s | %s | %s |" % (
                      clean(name), who or "-", ICON.get(st, st), d or "-"))
              md.append("")
              md.append("**成功 %d · 失败 %d**" % (
                  sum(1 for r in rs if r[2] == "OK"),
                  sum(1 for r in rs if r[2] == "FAIL")))
              return "\n".join(md)

          # 推送内容：不要标题（PushPlus 已用它做消息头）、不显示未配置的平台
          content = build([r for r in rows if r[2] != "SKIP"], "")
          # Actions 面板：保留完整信息，便于排查
          summary = build(rows, "## AI 签到日报")

          open("summary.md", "w", encoding="utf-8").write(summary + "\n")
          step = os.environ.get("GITHUB_STEP_SUMMARY")
          if step:
              open(step, "a", encoding="utf-8").write(summary + "\n")
          print(content)

          def post(url, data, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR " + str(e)

          title = "AI 签到日报 · " + now
          sent = []
          pp = os.environ.get("PUSHPLUS_TOKEN", "")
          if pp:
              body = urllib.parse.urlencode({
                  "token": pp, "title": title,
                  "template": "markdown", "content": content}).encode()
              sent.append("PushPlus -> " + post("https://www.pushplus.plus/send", body)[:150])
          wc = os.environ.get("WECOM_WEBHOOK", "")
          qy = os.environ.get("QYWX_TOKEN", "")
          if wc or qy:
              url = wc or ("https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=" + qy)
              payload = json.dumps({
                  "msgtype": "markdown",
                  "markdown": {"content": content}}).encode()
              sent.append("企业微信 -> " + post(url, payload, {"Content-Type": "application/json"})[:150])

          if not sent:
              print("!! 未配置任何推送渠道，手机收不到通知")
          for s in sent:
              print(s)
          PYEOF
